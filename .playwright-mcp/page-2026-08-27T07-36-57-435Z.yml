              - strong [ref=e66]: "Keywords:"
              - text: lyrics translation, phonetic constraints, LLM agents
            - generic [ref=e67]:
              - strong [ref=e68]: "Abstract:"
              - paragraph [ref=e70]: "Translating song lyrics while preserving singability requires satisfying musical constraints, including syllable counts, rhyme schemes, and syllable patterns, that standard machine translation ignores. We present a framework that exposes IPA-based phonetic analysis as a suite of composable Agent Skills, each defined by a natural-language description plus deterministic verification scripts that the orchestrating LLM invokes on demand. The agent extracts constraints from source lyrics, then translates through a multi-phase process, calling skills to verify all constraints and iteratively refine syllable-count mismatches. We formalize the three musical constraints, describe the IPA skill suite and agent architecture, and propose three evaluation metrics: Syllable Error Rate (SER), Syllable Count Relative Error (SCRE), and Adjusted Rand Index (ARI). Ablation experiments across three frontier orchestrators confirm that iterative tool-verified refinement dramatically improves constraint satisfaction and preserves rhyme structure substantially better than a supervised baseline, while requiring no task-specific training and no parallel corpora, and transferring to Spanish and Japanese targets with only a small language-specific syllabification adapter."
            - generic [ref=e71]:
              - strong [ref=e72]: "Track:"
              - text: Machine Translation
            - generic [ref=e73]:
              - strong [ref=e74]: "Paper Link:"
              - link "/forum?id=H0MGhuVH0Z" [ref=e76] [cursor=pointer]:
