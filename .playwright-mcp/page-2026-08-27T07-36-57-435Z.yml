            - generic [ref=e77]:
              - strong [ref=e78]: "Response To Metareview:"
              - generic [ref=e79]:
                - paragraph [ref=e80]: "Thanks to the reviewers and the AC. We're committing to EMNLP and will fold the answers to 9LVc and 2ghg into the final version as instructed: the COMET-22 and BLEU table with paired CIs, the Phase 1 versus Phase 2 ablation, the cross-system metric validity analysis, the prompt-only verifier promoted into the main comparison, and the tool-usage and latency statistics."
                - paragraph [ref=e81]: "One point for the record. Reviewer g7Wn's only weakness was the absence of a user study, but the submission does contain one in §6.4: six fluent-Mandarin raters, 60 judgments, 68% preference with binomial p=0.006, singability MOS 4.02 against 3.35. The section was clearly easy to miss and we're moving its numbers into the main results table. We mention it because the metareview lists small-scale human evaluation among the remaining concerns, whereas g7Wn's concern was that no such study existed at all. That review was also the one at confidence 4 and soundness 4."
                - paragraph [ref=e82]: We agree with 2ghg that the contribution is an engineering framework rather than a methodological advance, and we're raising the above only so the record is accurate.
